<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州 運航状況ボード</title>
<style>
  :root {
    --bg: #10161d; --panel: #171f29; --panel-line: #263140;
    --text-main: #e8ecf1; --text-dim: #8a97a8;
    --amber: #e0973f; --teal: #4fa89f; --sky: #5b8fc7;
    --red: #d1685a; --green: #5fae72; --gray: #56616f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-main);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding: 24px 14px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header {
    border-bottom: 1px solid var(--panel-line); padding-bottom: 16px; margin-bottom: 18px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  }
  .kicker { font-family: "Courier New", monospace; letter-spacing: 0.08em; color: var(--amber); font-size: 12px; margin-bottom: 6px; }
  h1 { font-size: 21px; margin: 0 0 6px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 480px; }
  #lastUpdated { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; text-align: right; }
  .section-title { display: flex; align-items: baseline; gap: 8px; margin: 26px 0 10px; }
  .section-title .mark { font-family: "Courier New", monospace; font-size: 13px; }
  .section-title h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .board { border: 1px solid var(--panel-line); border-radius: 4px; overflow: hidden; background: var(--panel); }
  .row { padding: 13px 15px; border-bottom: 1px solid var(--panel-line); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .company { font-size: 14.5px; font-weight: 600; }
  .route { font-family: "Courier New", monospace; font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .badge { flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 3px; white-space: nowrap; }
  .badge.unknown { background: #263140; color: var(--text-dim); }
  .badge.ok { background: rgba(95,174,114,0.15); color: var(--green); }
  .badge.warn { background: rgba(224,151,63,0.15); color: var(--amber); }
  .badge.ng { background: rgba(209,104,90,0.15); color: var(--red); }
  .badge.err { background: #263140; color: var(--gray); }
  .detail { margin-top: 8px; font-size: 12.5px; color: var(--text-dim); line-height: 1.6; display: none; }
  .detail.show { display: block; }
  .detail a { color: var(--sky); }
  .note { margin-top: 26px; border: 1px dashed var(--panel-line); border-radius: 4px; padding: 14px 15px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  footer { margin-top: 22px; font-size: 11px; color: #566171; text-align: center; }
  .load-error { padding: 16px; color: var(--red); font-size: 13px; }
  a.home-link { color: var(--sky); font-size: 12.5px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">KYUSHU TRANSIT STATUS BOARD</div>
      <h1>運航状況ボード</h1>
      <div class="sub">1時間ごとに自動更新されます。<a class="home-link" href="./index.html">← 危険箇所マップに戻る</a></div>
    </div>
    <div id="lastUpdated">読み込み中…</div>
  </header>

  <div class="section-title"><span class="mark" style="color:var(--sky)">✈</span><h2>航空</h2></div>
  <div class="board" id="airBoard"></div>

  <div class="section-title"><span class="mark" style="color:var(--teal)">⚓</span><h2>船（フェリー）</h2></div>
  <div class="board" id="shipBoard"></div>

  <div class="note">
    <strong>仕組みについて：</strong>裏側でGitHub Actionsが1時間ごとに各社サイトを取得し、簡易判定した結果をこのページに表示しています。表現の揺れがあるサイトや検索型ページ（ANAなど）は正しく判定できないことがあるため、詳細は必ずリンク先の公式情報でご確認ください。
  </div>
  <footer>情報は各社公式サイトの内容によります。最終判断は必ず公式サイトでご確認ください。</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // 危険箇所マップと同じFirebaseプロジェクトの設定
  const firebaseConfig = {
    apiKey: "AIzaSyBUYwkZ-wcOE5lfDSj563UJ2eR2JWpoBvQ",
    authDomain: "kumamoto-hazard-map.firebaseapp.com",
    databaseURL: "https://kumamoto-hazard-map-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kumamoto-hazard-map",
    storageBucket: "kumamoto-hazard-map.firebasestorage.app",
    messagingSenderId: "828112884275",
    appId: "1:828112884275:web:11dea040e7cafae231c946"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  function badgeClass(level) {
    return { ok: "ok", warn: "warn", ng: "ng", unknown: "unknown", err: "err" }[level] || "unknown";
  }

  function renderBoard(results) {
    const airBoard = document.getElementById("airBoard");
    const shipBoard = document.getElementById("shipBoard");
    airBoard.innerHTML = "";
    shipBoard.innerHTML = "";

    results.forEach(s => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="row-top">
          <div>
            <div class="company">${s.company}</div>
            <div class="route">${s.route}</div>
          </div>
          <div class="badge ${badgeClass(s.level)}">${s.label}</div>
        </div>
        <div class="detail">${s.detail}<br><a href="${s.url}" target="_blank" rel="noopener">公式サイトで見る →</a></div>
      `;
      row.querySelector(".row-top").onclick = () => {
        row.querySelector(".detail").classList.toggle("show");
      };
      (s.board === "air" ? airBoard : shipBoard).appendChild(row);
    });
  }

  async function loadStatus() {
    try {
      const snapshot = await get(ref(database, "transitStatus"));
      if (!snapshot.exists()) {
        document.getElementById("airBoard").innerHTML =
          `<div class="load-error">まだデータがありません。GitHub Actionsが一度も実行されていない可能性があります。</div>`;
        document.getElementById("lastUpdated").textContent = "データなし";
        return;
      }
      const data = snapshot.val();
      renderBoard(data.results);
      const updated = new Date(data.updated_at);
      document.getElementById("lastUpdated").textContent = "最終更新: " + updated.toLocaleString("ja-JP");
    } catch (e) {
      document.getElementById("airBoard").innerHTML =
        `<div class="load-error">読み込みに失敗しました: ${e.message}</div>`;
      document.getElementById("lastUpdated").textContent = "読み込み失敗";
    }
  }

  loadStatus();
</script>
</body>
</html>
